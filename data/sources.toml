# pulse-scout — source list
#
# Every entry below was confirmed by a live fetch: HTTP 200 AND a real feed/JSON body.
# Anything that answered with an HTML shell was dropped (see "Verified broken" at the bottom,
# so nobody re-adds them).
#
# TOML rather than YAML on purpose: Python 3.11 reads TOML from the standard library,
# so the config costs no dependency.
#
# tier      1 = Nico's actual job: backend, frontend, architecture, his cloud stack
#           2 = AI models and releases (explicit standing interest)
#           3 = broad awareness: security, hardware, crypto/fintech, founders, aggregators
# weight    multiplier applied during ranking. Higher = more likely to reach the Pflicht list.
# abstract  does the feed carry description text? Without it, ranking runs on title alone.
# signal    built-in relevance measure the source ships with, if any.
#
# Tier 1 is scoped to what Nico actually works with (established 2026-08-07 by reading the
# employer repos, not by guessing): FastAPI + SQLModel + Alembic + PostgreSQL on the backend,
# React 19 + TypeScript + Vite + Tailwind + React Aria on the frontend, Pulumi + Azure
# Container Apps + Azure DevOps for infrastructure, and architecture as the current focus.
# Notably NOT his stack: Terraform (they use Pulumi), Kubernetes (they use Container Apps),
# GitHub Actions (they use Azure DevOps), dbt (not his part of the platform).

