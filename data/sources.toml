# azure.microsoft.com/updates/feed/   HTML instead of XML (the working URL is in tier 1d)
# blog.fabric.microsoft.com           403 Cloudflare
# powerbi.microsoft.com/blog/feed/    403 Cloudflare — reachable via
#                                     learn.microsoft.com/api/search/rss?search=<term> if needed
# anthropic.com/news/rss.xml          404 — Anthropic has no RSS feed at all
# api.deepseek.com/news               401 — needs auth
# ai.meta.com/blog/rss/               404 — no working path found
# moonshotai.github.io/*              404 — Kimi has no blog feed; covered via HuggingFace
# uber.com/blog/engineering/rss/      406 — blocks automated clients
# shopify.engineering/blog.atom       200 but returns HTML, not a feed
# snowflake.com/*                     403 bot detection on all paths
# reddit.com (all variants)           403/429 — blocks unauthenticated server access since 2023
# cloudblogs.microsoft.com/feed/      dead, last entry December 2023
# nitter.poast.org, nitter.tiekoetter.com, nitter.privacyredirect.com, lightbrd.com
#                                     empty or unparseable — nitter.net was the only one working
#
# arXiv cs.AI / cs.LG are deliberately absent: ~450 papers/day with no relevance signal
# would drown the funnel. HuggingFace Daily Papers covers the curated subset instead.
