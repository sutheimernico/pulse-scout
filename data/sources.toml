# pulse-scout — source list
#
# Every entry below was confirmed by a live fetch on 2026-08-07: HTTP 200 AND a real
# feed/JSON body. Anything that answered with an HTML shell was dropped (see the
# "Verified broken" section at the bottom, so nobody re-adds them).
#
# TOML rather than YAML on purpose: Python 3.11 reads TOML from the standard library,
# so the config costs no dependency.
#
# tier      1 = AI models and releases (Nico's core interest)
#           2 = Azure / cloud (his working environment)
#           3 = everything else with real daily volume
# weight    multiplier applied during ranking. Higher = more likely to reach the Pflicht list.
# abstract  does the feed carry description text? Without it, ranking runs on title alone.
# signal    built-in relevance measure the source ships with, if any.

# =============================================================================
# TIER 1 — AI models and releases
# =============================================================================

[[source]]
name = "HuggingFace Trending"
tier = 1
weight = 1.6
url = "https://huggingface.co/api/models?sort=likes7d&direction=-1&limit=50"
kind = "json"
abstract = false
signal = "downloads + likes"
note = """The hardest available answer to 'which models are actually strong'. Do NOT switch
this to sort=createdAt — that returns hobbyist uploads with zero downloads and is useless."""

