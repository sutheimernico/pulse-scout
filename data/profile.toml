# pulse-scout — relevance profile
#
# What counts as relevant to Nico, and how much each factor moves an item.
#
# Derived on 2026-09-20 from PROJECT.md §3 and decision D7 — that is, from what his
# repositories actually contain. NOT from §1 or §4 of the design spec: those two paragraphs
# still describe him as "a junior fullstack developer specialising in data and BI", which is
# the exact premise D7 revokes. Anything built from that sentence would quietly reinstate the
# corrected-away assumption.
#
# Every constant the ranking uses lives here, so a change to what reaches the Pflicht list is
# a diff in a config file rather than a hunt through the code.

[factors]
# Multipliers applied to the (0..1) normalised inputs. Roughly: how much can this factor
# change an item's standing? engagement can add up to +45 %, keywords up to +120 %.
engagement = 0.45
keyword = 0.30
duplicate = 0.25

# The cross-source bonus stops here. Five outlets covering one story is a strong signal;
# fifteen is the same signal plus an aggregator echo chamber, and must not buy the top slot.
duplicate_cap = 4

# How fast an item stops being news. A day-old item keeps half its weight.
recency_half_life_hours = 24.0
# The floor keeps a three-day-old item rankable rather than annihilated.
recency_floor = 0.15
# An item whose feed gave no date. Below neutral: it has not proved it is fresh.
recency_undated = 0.55

# A single item cannot accumulate unlimited keyword credit.
keyword_cap = 4.0
# Multiplier when an excluded topic is matched and nothing strong is matched alongside it.
negative_penalty = 0.35

[tier_bonus]
# Tier 1 is his job and outranks everything. Tier 3 exists so a name has been read once.
1 = 1.60
2 = 1.20
3 = 1.00

# ---------------------------------------------------------------------------------------
# Positive terms. Weight = how much this word says "this is his work", not how common it is.
# Matched case-insensitively on word boundaries against title + summary.
# ---------------------------------------------------------------------------------------
